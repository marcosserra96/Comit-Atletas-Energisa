<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#009fc2" />
    <title>Sem conexão · Atletas Energisa</title>
    <style>
      *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f0f4f8;color:#132f38;font-family:Arial,sans-serif}.card{width:min(100%,420px);padding:32px;border:1px solid #dbe5e9;border-radius:20px;background:#fff;text-align:center;box-shadow:0 14px 40px rgba(0,80,97,.12)}img{width:88px;height:88px}h1{margin:20px 0 8px;font-size:24px}p{margin:0;color:#5f747c;line-height:1.6}button{margin-top:24px;border:0;border-radius:10px;padding:12px 20px;background:#009fc2;color:#fff;font-size:15px;font-weight:700;cursor:pointer}
    </style>
  </head>
  <body>
    <main class="card">
      <img src="/icons/icon-192.png" alt="" />
      <h1>Você está sem conexão</h1>
      <p>Conecte-se à internet para acessar seus dados atualizados no Atletas Energisa.</p>
      <button type="button" onclick="location.reload()">Tentar novamente</button>
    </main>
  </body>
</html>
